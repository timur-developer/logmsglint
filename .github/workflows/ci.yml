name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Unit tests
        run: go test ./...

      - name: Install golangci-lint v2.10.1
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Build custom golangci-lint (module plugin)
        run: golangci-lint custom -v

      - name: Run golangci-lint with plugin
        run: chmod +x ./custom-gcl && ./custom-gcl run -c .golangci.yml ./...



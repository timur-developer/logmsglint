name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Unit tests
        run: go test ./...

      - name: golangci-lint (module plugin)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: run -c .golangci.yml ./...
